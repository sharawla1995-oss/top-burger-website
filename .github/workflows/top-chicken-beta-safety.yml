name: Top Chicken Beta Safety Checks
on:
  push:
    branches:
      - codex/top-chicken-multitenant-beta-staging
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Beta website safety regression tests
        run: node --test tests/top-chicken-beta-safety.test.cjs
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
